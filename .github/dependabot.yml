version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories:
      - /images/debian-slim
      - /images/ubi-minimal
      - /images/alpine
      - /images/ubuntu
      - /images/rocky-minimal
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
